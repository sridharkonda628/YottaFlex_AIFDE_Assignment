[build-system]
requires = ["setuptools>=65.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "daily-metrics-pipeline"
version = "1.0.0"
description = "Deterministic incremental analytical metrics pipeline with data reconciliation and auditing for YottaFlex.ai"
authors = [{ name = "Sridhar", email = "candidate@yottaflex.ai" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1.0",
    "pandas>=2.2.0",
    "pyarrow>=17.0.0",
    "pytz>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
daily-metrics = "daily_metrics.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
pythonpath = ["src", "."]
addopts = "-v --strict-markers"

[tool.setuptools.packages.find]
where = ["src"]
